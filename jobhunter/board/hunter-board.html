<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JobHunterOS by KubeCraft</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* A personal job-hunting workspace: a narrow dark navigation rail, the job list, and the selected job beside it.
   Light first (the design reference), dark mirrored. The KubeCraft mark is the supplied file, never drawn here.
   Orange is for the one primary action and the selected destination; green only means a good or reliable state. */
:root{
  color-scheme:light;
  --bg:#f3f4f6;--panel:#ffffff;--panel-2:#f6f7f9;--line:#e3e5ea;--line-2:#d2d6dd;--ink:#15171b;--ink-2:#3d424b;--muted:#6b717c;
  --accent:#e8720c;--accent-hover:#d3660a;--accent-ink:#ffffff;--accent-dim:rgba(232,114,12,.1);
  --good:#1e8e4c;--good-dim:#e6f5ec;--warn:#9a6500;--warn-dim:#fff4d6;--bad:#c23b3b;--bad-dim:#fdeaea;--info:#3458c7;--info-dim:#e8eefb;--tag:#5a2fbe;--tag-dim:#efe9fb;
  --rail:#131417;--rail-ink:#f3f4f6;--rail-muted:#9aa0ab;--rail-sel:#2a1c0e;
  --shadow:0 6px 24px rgba(20,22,30,.08);
  --display:"Manrope",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --body:"Source Sans 3",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --r:12px;--r-sm:8px;--r-xs:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f1013;--panel:#17191e;--panel-2:#1f2228;--line:#2a2e37;--line-2:#363b46;--ink:#f1f2f4;--ink-2:#c4c8d0;--muted:#8c929d;
  --accent:#ff7f1f;--accent-hover:#ff9240;--accent-ink:#141414;--accent-dim:rgba(255,127,31,.14);
  --good:#4fd283;--good-dim:rgba(79,210,131,.14);--warn:#f1b84a;--warn-dim:rgba(241,184,74,.16);--bad:#ff6b6b;--bad-dim:rgba(255,107,107,.14);--info:#8aaeff;--info-dim:rgba(138,174,255,.14);--tag:#b79bff;--tag-dim:rgba(183,155,255,.14);
  --rail:#0a0b0d;--rail-ink:#f3f4f6;--rail-muted:#9aa0ab;--rail-sel:#2b1a0a;
  --shadow:0 10px 32px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1013;--panel:#17191e;--panel-2:#1f2228;--line:#2a2e37;--line-2:#363b46;--ink:#f1f2f4;--ink-2:#c4c8d0;--muted:#8c929d;
  --accent:#ff7f1f;--accent-hover:#ff9240;--accent-ink:#141414;--accent-dim:rgba(255,127,31,.14);
  --good:#4fd283;--good-dim:rgba(79,210,131,.14);--warn:#f1b84a;--warn-dim:rgba(241,184,74,.16);--bad:#ff6b6b;--bad-dim:rgba(255,107,107,.14);--info:#8aaeff;--info-dim:rgba(138,174,255,.14);--tag:#b79bff;--tag-dim:rgba(183,155,255,.14);
  --rail:#0a0b0d;--rail-ink:#f3f4f6;--rail-muted:#9aa0ab;--rail-sel:#2b1a0a;
  --shadow:0 10px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.45 var(--body);overflow:hidden}
button,textarea,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance}
a{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ---- shell ---- */
.app{display:grid;grid-template-columns:88px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100dvh;height:100vh}
.side{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;align-items:stretch;padding:12px 8px calc(10px + env(safe-area-inset-bottom,0px));gap:4px;border-right:1px solid rgba(255,255,255,.06)}
.brand-head{display:block;margin:0 0 10px;padding:4px 2px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:11px;letter-spacing:.2px;text-align:center;line-height:1.15}
.brand .mark{width:40px;height:40px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:#000;color:#fff;font-size:12px;font-weight:800;letter-spacing:.5px;overflow:hidden}.brand .mark img{width:40px;height:40px;display:block}
.brand small{display:block;font-weight:600;color:var(--rail-muted);font-size:8.5px;letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
.nav{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:var(--rail-muted);border-radius:10px;padding:9px 4px 8px;cursor:pointer;font-size:11.5px;font-weight:600;line-height:1}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{color:var(--rail-ink);background:rgba(255,255,255,.06)}
.nav[aria-current="page"]{color:var(--accent);background:var(--rail-sel);box-shadow:inset 3px 0 0 var(--accent)}
.nav.settings{margin-top:auto}
.nav .n{position:absolute;top:4px;right:10px;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
.nav{position:relative}
main{display:grid;grid-template-columns:minmax(320px,38%) minmax(0,1fr);min-width:0;min-height:0;height:100%}
.col{min-width:0;min-height:0;height:100%;overflow:auto;overscroll-behavior:contain}
.list-col{border-right:1px solid var(--line);background:var(--bg);padding:16px 16px 40px}
.detail-col{background:var(--bg);padding:16px 20px 48px}
.colhead{display:flex;align-items:flex-start;gap:12px;margin:2px 0 12px}
.colhead h1{font-size:19px;line-height:1.2}
.colhead .sub{color:var(--muted);font-size:13px;margin-top:2px}
.colhead .right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:3px 9px;border:1px solid var(--line);background:var(--panel);border-radius:999px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#9aa0ab;flex:none}
.dot.ok{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.notice{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.notice h2{font-size:16px;margin-bottom:4px}.notice p{margin:0;color:var(--ink-2)}
section.block{margin-bottom:18px}
section.block>h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-family:var(--body);font-weight:600;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
section.block>h2 small{text-transform:none;letter-spacing:0;font-weight:400}
.foot{color:var(--muted);font-size:12.5px}
.empty{padding:22px 14px;color:var(--muted);text-align:center;background:var(--panel);border:1px dashed var(--line-2);border-radius:var(--r)}
/* ---- buttons, pills, tags ---- */
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r-sm);padding:7px 12px;cursor:pointer;font-weight:600;font-size:13px;line-height:1.2;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn.on{background:var(--accent-dim);border-color:var(--accent);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn.lg{padding:10px 16px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:focus-visible,.row:focus-visible,.nav:focus-visible,.fchip:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{font-size:11.5px;border-radius:999px;padding:2px 8px;white-space:nowrap;border:1px solid transparent;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.g-good{background:var(--good-dim);color:var(--good)}.g-worth_a_shot{background:var(--info-dim);color:var(--info)}
.g-backup{background:var(--panel-2);color:var(--ink-2);border-color:var(--line)}.g-uncertain{background:var(--warn-dim);color:var(--warn)}.g-other{background:var(--panel-2);color:var(--muted);border-color:var(--line)}
.p-applied{background:var(--good-dim);color:var(--good)}.p-dismissed{background:var(--bad-dim);color:var(--bad)}.p-pending{background:var(--warn-dim);color:var(--warn)}.p-fresh{background:var(--accent-dim);color:var(--accent)}
.tag{font-size:11.5px;border-radius:var(--r-xs);padding:2px 7px;background:var(--info-dim);color:var(--info);font-weight:600;white-space:nowrap}
.tag.role{background:var(--accent-dim);color:var(--accent)}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.star{color:var(--accent)}
/* ---- icons and logos ---- */
.ricon{width:36px;height:36px;flex:none;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2)}
.ricon svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ricon.lg{width:48px;height:48px;border-radius:12px}.ricon.lg svg{width:26px;height:26px}
.logo{width:44px;height:44px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--display);font-weight:800;font-size:14px;color:var(--ink-2);letter-spacing:.3px}
.logo img{width:28px;height:28px;object-fit:contain;display:block}
.logo.sm{width:22px;height:22px;border-radius:6px;font-size:9px}.logo.sm img{width:16px;height:16px}
/* ---- job rows ---- */
.list{display:grid;gap:8px}
.grouph{padding:6px 2px 0;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;color:var(--ink)}
.row:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.row[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.row .t{font-weight:700;font-family:var(--display);font-size:15px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.row .tags{margin-top:7px}
.row .rside{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.row .rside .chev{color:var(--muted);font-size:16px;line-height:1}
.row .marks{display:flex;gap:4px;align-items:center}
.pickhead{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.viewall{margin-top:8px;display:flex;justify-content:flex-end}
/* ---- filters ---- */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools input[type=search]{flex:1 1 180px;min-width:0;border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:7px 12px}
.fsel{border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r-sm);padding:7px 10px;max-width:100%}
/* ---- attention / today items ---- */
.items{display:grid;gap:6px}
.item{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-sm);padding:9px 12px;font-size:13.5px}
.item.good{border-left-color:var(--good)}.item.warn{border-left-color:var(--warn)}.item.bad{border-left-color:var(--bad)}
.item button,.item a.btn{margin-left:auto;white-space:nowrap}
.activity{display:flex;gap:8px;flex-wrap:wrap}
.activity .stat{background:var(--panel)}
/* ---- detail ---- */
.detail{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-height:60vh;display:flex;flex-direction:column;min-width:0}
.detail.placeholder{align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:40px 24px;border-style:dashed;background:transparent}
.dhead{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.dhead .top{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.dhead .top>.ttl{min-width:0;flex:1 1 260px}
.dhead h2{font-size:21px;line-height:1.2}
.dhead .co{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-2);font-size:13.5px;margin-top:4px}
.dhead .co a{color:var(--ink-2);text-decoration:none;font-weight:600}.dhead .co a:hover{text-decoration:underline}
.dhead .hacts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-self:flex-start}
.facts{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-2);font-size:13px}
.facts span{display:inline-flex;align-items:center;gap:5px}
.facts svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dbody{padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;min-width:0}
.help{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 18px;align-items:center}
.help h3{font-size:15.5px;margin-bottom:2px}
.help p{margin:0 0 8px;color:var(--ink-2);font-size:13.5px}
.help ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:4px 14px;font-size:13px;color:var(--ink-2)}
.help li{display:flex;gap:6px;align-items:center}.help li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--good);flex:none}
.help .cta{display:flex;flex-direction:column;gap:8px;min-width:200px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--panel);min-width:0}
.card h3{font-size:14.5px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card h3 svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card.fit{background:var(--warn-dim);border-color:transparent}
:root[data-theme="dark"] .card.fit,:root:not([data-theme="light"]) .card.fit{background:var(--panel-2);border-color:var(--line)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .card.fit{background:#fff8ee;border-color:#f3dfc0}}
.kv{display:grid;grid-template-columns:minmax(110px,auto) minmax(0,1fr);gap:5px 12px;font-size:13.5px}
.kv span:first-child{color:var(--muted)}
.kv a{word-break:break-word}
ul.r{margin:0;padding-left:18px}ul.r li{margin:3px 0}
ul.fitl{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13.5px}
ul.fitl li{display:flex;gap:8px;align-items:flex-start}
ul.fitl li::before{content:"✓";color:var(--good);font-weight:700;flex:none}
ul.fitl.check li::before{content:"•";color:var(--warn)}
.card h4{font-size:13px;margin:10px 0 5px;display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.card h4 svg{width:15px;height:15px;stroke:var(--warn);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.desc{white-space:pre-wrap;color:var(--ink-2);font-size:14px;max-width:76ch}
.desc.lead{max-height:7.6em;overflow:hidden;position:relative}
.links{display:flex;gap:10px;flex-wrap:wrap;font-size:13.5px;margin-top:8px}
.sec h3{font-size:14.5px;margin-bottom:6px}
.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.status b{font-family:var(--display)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.save{font-size:12.5px;min-height:18px;margin:4px 0 0;color:var(--muted)}
.save.ok{color:var(--good)}.save.err{color:var(--bad)}.save.warn{color:var(--warn)}
textarea{width:100%;min-height:90px;border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r-sm);padding:8px;resize:vertical}
input[type=text],input[type=date],select{border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r-sm);padding:8px;color:inherit}
input[type=text],select{width:100%}
label{display:grid;gap:4px;font-size:13px;color:var(--ink-2)}
label.radio{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.conflict{border:1px solid var(--warn);background:var(--warn-dim);border-radius:var(--r-sm);padding:8px;margin:6px 0;font-size:13px}
.conflict .theirs{white-space:pre-wrap;margin:6px 0;color:var(--ink)}
/* ---- workspace ---- */
.ws .step{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--panel)}
.ws .step>h3{font-size:14.5px;display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ws .step>h3 .num{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12.5px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ws .step.done>h3 .num{background:var(--good)}
.part{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;margin:8px 0;background:var(--panel-2)}
.part>summary{cursor:pointer;font-weight:700;font-family:var(--display);font-size:13.5px}
details.sub{margin-top:6px}details.sub>summary{cursor:pointer;font-size:13px;color:var(--ink-2);font-weight:600}
.tier{margin:8px 0 2px;font-size:13.5px}
table.case{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}
table.case th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:4px 6px;border-bottom:1px solid var(--line)}
table.case td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
ul.check{list-style:none;margin:0;padding:0}ul.check li{margin:3px 0}ul.check li.done{color:var(--good)}
.ans,.contact,.cvrow,.opt,.fu,.applied,.cvpick{border-top:1px solid var(--line);padding:8px 0;display:grid;gap:6px}
.ans:first-child,.contact:first-child,.cvrow:first-child,.opt:first-child,.cvpick:first-child{border-top:0}
.ans .q,.contact .q,.cvrow .q{font-weight:600}
.sug{background:var(--panel-2);border-radius:var(--r-sm);padding:8px;font-size:14px}
.cvrow.off{opacity:.65}
/* ---- applications / profile ---- */
.approw{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:left;width:100%;cursor:pointer;color:var(--ink)}
.approw:hover{border-color:var(--line-2)}
.approw .t{font-weight:700;font-family:var(--display);font-size:14.5px}
.approw .s{color:var(--muted);font-size:12.5px}
.approw .next{font-size:12.5px;color:var(--ink-2);text-align:right;white-space:nowrap}
.prof{display:grid;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink-2);background:var(--panel-2)}
/* ---- responsive ---- */
@media (max-width:1100px){main{grid-template-columns:minmax(300px,42%) minmax(0,1fr)}.help{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .side{flex-direction:row;align-items:center;order:2;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid rgba(255,255,255,.08);gap:2px}
  .brand-head{display:none}
  .nav{flex:1;padding:6px 2px}.nav.settings{margin-top:0;flex:0 0 64px}
  .nav[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
  main{grid-template-columns:1fr;order:1;min-height:0}

<script>
/* ===CORE-START=== pure logic, testable without a browser */
const Core = (() => {
  const clone = (o) => JSON.parse(JSON.stringify(o || {}));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const blankAction = (jobKey) => ({ job_key: jobKey, favorite: false, saved: false, applied_at: null, dismissed: false, note: null, rev: 0 });

  // Conditional write: the browser db API has no if_version, so take a short lease, read, check, write rev+1.
  async function commit(db, path, mutate, holder, opts = {}) {
    const ttlMs = opts.ttlMs || 2000, retries = opts.retries ?? 5;
    const ref = db.doc(path);
    for (let attempt = 0; ; attempt++) {
      let lease;
      try { lease = await ref.acquire({ holder, ttlMs }); }

          try { const s = await ref.get(); if (!s.exists) await ref.set(opts.blank); } catch (e2) { return { status: "error", code: e2 && e2.code || "unavailable" }; }
          opts = Object.assign({}, opts, { _created: true });
          continue;
        }
        return { status: "error", code: e && e.code || "unavailable", message: e && e.message };
      }
      if (!lease || !lease.acquired) {
        if (attempt >= retries) return { status: "busy", attempts: attempt + 1 };

        continue;
      }
      let snap;
      try { snap = await ref.get(); } catch (e) { return { status: "error", code: e && e.code || "unavailable" }; }
      const cur = snap.exists ? (snap.data() || {}) : {};
      const out = mutate(clone(cur));
      if (!out || out.conflict) return { status: "conflict", current: cur, attempts: attempt + 1 };
      const next = out.doc;
      next.rev = (Number(cur.rev) || 0) + 1;
      next.updated_at = new Date().toISOString();
      next.updated_by = holder;
      try { await ref.set(next); } catch (e) { return { status: "error", code: e && e.code || "unavailable" }; }
      return { status: "saved", doc: next, attempts: attempt + 1 };
    }
  }
  function effective(job, action) {
    const s = (job && job.state) || {};
    // A synced note keeps the revision the page's own action document carries, so the next edit starts from it.
    const noteRev = (action && action.note && Number(action.note.rev)) || 0;
    const base = { favorite: !!s.favorited, saved: !!s.saved, applied_at: s.applied_at || null, dismissed: !!s.dismissed, note: s.note ? { text: s.note, rev: noteRev } : null, rev: 0 };
    if (!action || !(Number(action.rev) > Number(s.synced_rev || 0))) return Object.assign(base, { pending: false });
    return { favorite: !!action.favorite, saved: !!action.saved, applied_at: action.applied_at || null, dismissed: !!action.dismissed,
      note: action.note && action.note.text ? action.note : (action.note && action.note.deleted ? null : base.note), rev: Number(action.rev) || 0, pending: true };
  }
  const seenToAction = (seen) => seen ? { favorite: !!seen.favorite, saved: !!seen.saved, applied_at: seen.applied_at || null, dismissed: !!seen.dismissed, note: seen.note && seen.note.text ? { text: seen.note.text, rev: Number(seen.note.rev) || 0 } : null } : {};
  const setFlag = (jobKey, field, value, seen) => (cur) => {
    const d = Object.assign(blankAction(jobKey), seenToAction(seen), cur);

    return { doc: d };
  };
  const saveNote = (jobKey, baseNoteRev, text, seen) => (cur) => {
    const d = Object.assign(blankAction(jobKey), seenToAction(seen), cur);

    return { doc: d };
  };
  const setPrefs = (fields) => (cur) => ({ doc: Object.assign({ job_key: "_prefs" }, cur, fields) });

  function tabsFor(jobs, actions, run) {
    const eff = (k) => effective(jobs.get(k), actions.get(k));

    const open = (k) => { const e = eff(k); return !e.dismissed && !e.applied_at; };
    const rec = ((run && run.recommended) || []).filter((k) => jobs.has(k)).filter(open);
    const byGroup = (g) => rec.filter((k) => (jobs.get(k) || {}).group === g);

      recommended: rec, good: byGroup("good"), worth_a_shot: byGroup("worth_a_shot"), backup: byGroup("backup"),

    out.sort((a, b) => rank(a) - rank(b) || (first.includes(a) ? 0 : 1) - (first.includes(b) ? 0 : 1) || keys.indexOf(a) - keys.indexOf(b));

  const setRequest = (jobKey, kind, id, params, seen) => (cur) => {
    const d = Object.assign(blankAction(jobKey), seenToAction(seen), cur);

    d.answers = Object.assign({}, d.answers || {}, { [aid]: { text: String(text || "").slice(0, 4000), rev: Math.max(stored, baseRev) + 1, updated_at: new Date().toISOString() } });
    return { doc: d };
  };
  const saveText = (jobKey, kind, text, baseRev, seen) => (cur) => {
    const d = Object.assign(blankAction(jobKey), seenToAction(seen), cur);
    const stored = Number(((d.texts || {})[kind] || {}).rev || 0);
    if (stored > baseRev) return { conflict: true };
    d.texts = Object.assign({}, d.texts || {}, { [kind]: { text: String(text || "").slice(0, 8000), rev: Math.max(stored, baseRev) + 1, updated_at: new Date().toISOString() } });

  };
  const setCv = (key, fields) => (cur) => { const d = Object.assign({ job_key: "_cvs", variants: {} }, cur); d.variants = Object.assign({}, d.variants || {}, { [key]: Object.assign({}, (d.variants || {})[key] || {}, fields) }); return { doc: d }; };
  const setCvRequest = (key, id) => (cur) => { const d = Object.assign({ job_key: "_cvs", variants: {} }, cur); d.requests = Object.assign({}, d.requests || {}, { cv_file: { id, at: new Date().toISOString(), params: { cv: key } } }); return { doc: d }; };
  // The state of one request as the page should show it: the page's own latest request wins until Hunter has
  // recorded that very id; then Hunter's state (running, ready, needs_input, failed) is the truth.
  function requestState(work, action, kind) {
    const mine = action && action.requests && action.requests[kind];

    if (theirs) return { state: theirs.state, id: theirs.id, at: theirs.at, message: theirs.message, result: theirs.result || null, mine: false };
    return null;
  }
  // One main action per job: Prepare my application -> Continue application -> View application.
  function mainAction(work, action) {
    const applied = !!(action && Number(action.rev) > 0 ? action.applied_at : (work && work.state === "applied"));
    const prep = requestState(work, action, "prepare");
    if (applied) return { kind: "view", label: "View application" };
    if (work && work.package) return { kind: "continue", label: "Continue application" };
    if (prep && prep.state === "requested") return { kind: "continue", label: "Continue application" };
    if (prep && (prep.state === "running")) return { kind: "continue", label: "Continue application" };
    return { kind: "prepare", label: "Prepare my application" };
  }
  // The application's state in plain words: not started, preparing, needs your answer, ready for review, applied, needs review.
  function appStatus(work, action) {
    const applied = !!(action && Number(action.rev) > 0 ? action.applied_at : (work && work.state === "applied"));
    if (applied) return { id: "applied", label: "Applied" };

    const pkg = work && work.package;
    if (pkg && pkg.needs_review && pkg.needs_review.length) return { id: "needs_review", label: "Needs review: the vacancy changed" };
    if (prep && prep.state === "needs_input") return { id: "needs_answer", label: "Needs your answer" };
    if (prep && (prep.state === "requested" || prep.state === "running")) return { id: "preparing", label: "Preparing" };

      if ((rd.form_questions || 0) > (rd.answered || 0)) return { id: "needs_answer", label: "Needs your answer" };

  async function reachHunter(id, k) {
