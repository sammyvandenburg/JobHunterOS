<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JobHunterOS by KubeCraft</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* The visual side of the running Hunter session: a dark navigation rail, the job list, the selected job beside it.
   Light first (the design reference), dark mirrored. The KubeCraft mark is the supplied file, never drawn here.
   Orange marks the one primary action and the selected destination; green means a good or reliable state. */
:root{
  color-scheme:light;
  --bg:#f3f4f6;--panel:#ffffff;--panel-2:#f6f7f9;--line:#e3e5ea;--line-2:#d2d6dd;--ink:#15171b;--ink-2:#3d424b;--muted:#6b717c;
  --accent:#e8720c;--accent-hover:#d3660a;--accent-ink:#ffffff;--accent-dim:rgba(232,114,12,.1);
  --good:#1e8e4c;--good-dim:#e6f5ec;--warn:#9a6500;--warn-dim:#fff4d6;--bad:#c23b3b;--bad-dim:#fdeaea;--info:#3458c7;--info-dim:#e8eefb;--fit:#fff8ee;--fit-line:#f3dfc0;
  --rail:#131417;--rail-ink:#f3f4f6;--rail-muted:#9aa0ab;--rail-sel:#2a1c0e;
  --shadow:0 6px 24px rgba(20,22,30,.08);
  --display:"Manrope",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --body:"Source Sans 3",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --r:12px;--r-sm:8px;--r-xs:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f1013;--panel:#17191e;--panel-2:#1f2228;--line:#2a2e37;--line-2:#363b46;--ink:#f1f2f4;--ink-2:#c4c8d0;--muted:#8c929d;
  --accent:#ff7f1f;--accent-hover:#ff9240;--accent-ink:#141414;--accent-dim:rgba(255,127,31,.14);
  --good:#4fd283;--good-dim:rgba(79,210,131,.14);--warn:#f1b84a;--warn-dim:rgba(241,184,74,.16);--bad:#ff6b6b;--bad-dim:rgba(255,107,107,.14);--info:#8aaeff;--info-dim:rgba(138,174,255,.14);--fit:#1f2228;--fit-line:#2a2e37;
  --rail:#0a0b0d;--rail-ink:#f3f4f6;--rail-muted:#9aa0ab;--rail-sel:#2b1a0a;
  --shadow:0 10px 32px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1013;--panel:#17191e;--panel-2:#1f2228;--line:#2a2e37;--line-2:#363b46;--ink:#f1f2f4;--ink-2:#c4c8d0;--muted:#8c929d;
  --accent:#ff7f1f;--accent-hover:#ff9240;--accent-ink:#141414;--accent-dim:rgba(255,127,31,.14);
  --good:#4fd283;--good-dim:rgba(79,210,131,.14);--warn:#f1b84a;--warn-dim:rgba(241,184,74,.16);--bad:#ff6b6b;--bad-dim:rgba(255,107,107,.14);--info:#8aaeff;--info-dim:rgba(138,174,255,.14);--fit:#1f2228;--fit-line:#2a2e37;
  --rail:#0a0b0d;--rail-ink:#f3f4f6;--rail-muted:#9aa0ab;--rail-sel:#2b1a0a;
  --shadow:0 10px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.42 var(--body);overflow:hidden}
button,textarea,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance}
a{color:var(--accent)}
/* ---- shell ---- */
.app{display:grid;grid-template-columns:84px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100dvh;height:100vh}
.side{background:var(--rail);color:var(--rail-ink);display:flex;flex-direction:column;align-items:stretch;padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));gap:2px;border-right:1px solid rgba(255,255,255,.06)}
.brand-head{display:block;margin:0 0 8px;padding:2px 2px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;flex-direction:column;align-items:center;gap:5px;font-family:var(--display);font-weight:800;font-size:10.5px;letter-spacing:.2px;text-align:center;line-height:1.15}
.brand .mark{width:38px;height:38px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;background:#000;color:#fff;font-size:12px;font-weight:800;letter-spacing:.5px;overflow:hidden}.brand .mark img{width:38px;height:38px;display:block}
.brand small{display:block;font-weight:600;color:var(--rail-muted);font-size:8px;letter-spacing:.5px;text-transform:uppercase;margin-top:1px}
.nav{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:var(--rail-muted);border-radius:10px;padding:8px 4px 7px;cursor:pointer;font-size:11px;font-weight:600;line-height:1}
.nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{color:var(--rail-ink);background:rgba(255,255,255,.06)}
.nav[aria-current="page"]{color:var(--accent);background:var(--rail-sel);box-shadow:inset 3px 0 0 var(--accent)}
.nav.settings{margin-top:auto}
.nav .n{position:absolute;top:3px;right:9px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 4px}
main{display:grid;grid-template-columns:minmax(320px,37%) minmax(0,1fr);min-width:0;min-height:0;height:100%}
.col{min-width:0;min-height:0;height:100%;overflow:auto;overscroll-behavior:contain}
.list-col{border-right:1px solid var(--line);background:var(--bg);padding:14px 14px 40px}
.detail-col{background:var(--bg);padding:14px 16px 48px}
.colhead{display:flex;align-items:flex-start;gap:10px;margin:0 0 10px}
.colhead h1{font-size:18px;line-height:1.2}
.colhead .sub{color:var(--muted);font-size:12.5px;margin-top:1px}
.colhead .right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:3px 9px;border:1px solid var(--line);background:var(--panel);border-radius:999px;white-space:nowrap}
button.stat{cursor:pointer}
.stat.bad{color:var(--bad);border-color:var(--bad)}
.dot{width:7px;height:7px;border-radius:50%;background:#9aa0ab;flex:none}
.dot.ok{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--warn-dim);border:1px solid var(--warn);border-radius:var(--r-sm);padding:7px 12px;font-size:13px;margin-bottom:10px}
.banner button{margin-left:auto}
.notice{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.notice h2{font-size:15px;margin-bottom:3px}.notice p{margin:0;color:var(--ink-2)}
section.block{margin-bottom:14px}
section.block>h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-family:var(--body);font-weight:600;margin:0 0 6px;display:flex;align-items:baseline;gap:8px}
section.block>h2 small{text-transform:none;letter-spacing:0;font-weight:400}
.foot{color:var(--muted);font-size:12px}
.empty{padding:18px 14px;color:var(--muted);text-align:center;background:var(--panel);border:1px dashed var(--line-2);border-radius:var(--r)}
/* ---- buttons, pills, tags ---- */
.btn{border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r-sm);padding:6px 11px;cursor:pointer;font-weight:600;font-size:13px;line-height:1.2;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn.on{background:var(--accent-dim);border-color:var(--accent);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.lg{padding:9px 15px;font-size:14px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.55;cursor:default}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:focus-visible,.row:focus-visible,.nav:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible,.approw:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{font-size:11.5px;border-radius:999px;padding:2px 8px;white-space:nowrap;border:1px solid transparent;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.g-good{background:var(--good-dim);color:var(--good)}.g-worth_a_shot{background:var(--info-dim);color:var(--info)}
.g-backup{background:var(--panel-2);color:var(--ink-2);border-color:var(--line)}.g-uncertain{background:var(--warn-dim);color:var(--warn)}.g-other{background:var(--panel-2);color:var(--muted);border-color:var(--line)}
.p-applied{background:var(--good-dim);color:var(--good)}.p-dismissed{background:var(--bad-dim);color:var(--bad)}.p-pending{background:var(--warn-dim);color:var(--warn)}.p-fresh{background:var(--accent-dim);color:var(--accent)}
.tag{font-size:11.5px;border-radius:var(--r-xs);padding:2px 7px;background:var(--info-dim);color:var(--info);font-weight:600;white-space:nowrap}
.tag.role{background:var(--accent-dim);color:var(--accent)}
.tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.star{color:var(--accent)}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--line-2);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
/* ---- icons and logos ---- */
.ricon{width:34px;height:34px;flex:none;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:var(--accent-dim);border:1px solid var(--fit-line);color:var(--accent)}
.ricon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ricon.lg{width:44px;height:44px;border-radius:11px}.ricon.lg svg{width:24px;height:24px}
.ricon.xs{width:20px;height:20px;border-radius:6px;border:0}.ricon.xs svg{width:13px;height:13px}
.logo{width:42px;height:42px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--display);font-weight:800;font-size:13.5px;color:var(--ink-2);letter-spacing:.3px}
.logo img{width:26px;height:26px;object-fit:contain;display:block}
.logo.sm{width:22px;height:22px;border-radius:6px;font-size:9px}.logo.sm img{width:16px;height:16px}
/* ---- job rows ---- */
.list{display:grid;gap:7px}
.grouph{padding:4px 2px 0;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.row{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:11px;align-items:start;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;cursor:pointer;color:var(--ink)}
.row:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.row[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.row .t{font-weight:700;font-family:var(--display);font-size:14.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.row .tags{margin-top:6px}
.row .rside{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--muted);white-space:nowrap}
.row .rside .chev{color:var(--muted);font-size:16px;line-height:1}
.row .marks{display:flex;gap:4px;align-items:center}
.pickhead{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.viewall{margin-top:6px;display:flex;justify-content:flex-end}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tools input[type=search]{flex:1 1 180px;min-width:0;border:1px solid var(--line-2);background:var(--panel);border-radius:999px;padding:6px 12px}
.fsel{border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r-sm);padding:6px 10px;max-width:100%}
.items{display:grid;gap:6px}
.item{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-sm);padding:8px 12px;font-size:13px}
.item.good{border-left-color:var(--good)}.item.warn{border-left-color:var(--warn)}.item.bad{border-left-color:var(--bad)}
.item button,.item a.btn{margin-left:auto;white-space:nowrap}
.activity{display:flex;gap:6px;flex-wrap:wrap}.activity .stat{white-space:normal}
/* ---- detail ---- */
.detail{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-height:60vh;display:flex;flex-direction:column;min-width:0}
.detail.placeholder{align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:40px 24px;border-style:dashed;background:transparent}
.dhead{padding:12px 16px 10px;border-bottom:1px solid var(--line);display:grid;gap:7px}
.dhead .top{display:flex;gap:11px;align-items:flex-start;flex-wrap:wrap}
.dhead .top>.ttl{min-width:0;flex:1 1 260px}
.dhead h2{font-size:19px;line-height:1.2}
.dhead .co{display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--ink-2);font-size:13px;margin-top:3px}
.dhead .co a{color:var(--ink-2);text-decoration:none;font-weight:600}.dhead .co a:hover{text-decoration:underline}
.dhead .hacts{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-self:flex-start}
.facts{display:flex;gap:6px;flex-wrap:wrap;color:var(--ink-2);font-size:12.5px;align-items:center}
.facts span+span::before{content:"·";color:var(--muted);margin-right:6px}
.dbody{padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;min-width:0}
.help{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.help .hrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.help h3{font-size:14.5px}
.help p{margin:0;color:var(--ink-2);font-size:13px}
.help .cta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:12.5px;border:1px solid var(--line-2);border-radius:999px;padding:4px 10px;background:var(--panel);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip:hover{border-color:var(--ink-2)}
.chip.busy{color:var(--muted);cursor:default}
.chip.done{border-color:var(--good);color:var(--good)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.chip:disabled{opacity:.6;cursor:default}
.chip svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.statusrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink-2);padding-top:6px;border-top:1px solid var(--line)}
.statusrow b{font-family:var(--display);color:var(--ink)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--panel);min-width:0}
.card h3{font-size:13.5px;margin-bottom:6px;display:flex;align-items:center;gap:7px}
.card h3 svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card.fit{background:var(--fit);border-color:var(--fit-line)}
.kv{display:grid;grid-template-columns:minmax(96px,auto) minmax(0,1fr);gap:3px 10px;font-size:12.5px}
.kv span:first-child{color:var(--muted)}
.kv a{word-break:break-word}
ul.r{margin:0;padding-left:18px}ul.r li{margin:3px 0}
ul.fitl{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px}
ul.fitl li{display:flex;gap:7px;align-items:flex-start}
ul.fitl li::before{content:"✓";color:var(--good);font-weight:700;flex:none}
ul.fitl.check li::before{content:"△";color:var(--warn)}
.card h4{font-size:12.5px;margin:8px 0 4px;display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.desc{white-space:pre-wrap;color:var(--ink-2);font-size:13.5px;max-width:76ch}
.desc.lead{max-height:4.4em;overflow:hidden}
.links{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.save{font-size:12.5px;min-height:16px;margin:3px 0 0;color:var(--muted)}
.save.ok{color:var(--good)}.save.err{color:var(--bad)}.save.warn{color:var(--warn)}
textarea{width:100%;min-height:80px;border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r-sm);padding:8px;resize:vertical}
input[type=text],input[type=date],select{border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r-sm);padding:7px;color:inherit}
input[type=text],select{width:100%}
label{display:grid;gap:3px;font-size:12.5px;color:var(--ink-2)}
label.radio{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink)}
.conflict{border:1px solid var(--warn);background:var(--warn-dim);border-radius:var(--r-sm);padding:8px;margin:6px 0;font-size:13px}
.conflict .theirs{white-space:pre-wrap;margin:6px 0;color:var(--ink)}
/* ---- workspace ---- */
.ws .step{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:var(--panel)}
.ws .step>h3{font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.ws .step>h3 .foot{font-weight:400}
.ev{display:grid;gap:6px}
.ev .e{display:grid;grid-template-columns:minmax(120px,auto) minmax(0,1fr);gap:2px 10px;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.ev .e:first-child{border-top:0}
.ev .e b{font-family:var(--display)}
.ev .e.gap b{color:var(--warn)}
.part{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;margin:6px 0;background:var(--panel-2)}
.part>summary{cursor:pointer;font-weight:700;font-family:var(--display);font-size:13px}
details.sub{margin-top:6px}details.sub>summary{cursor:pointer;font-size:12.5px;color:var(--ink-2);font-weight:600}
.tier{margin:6px 0 2px;font-size:13px}
ul.check{list-style:none;margin:0;padding:0}ul.check li{margin:3px 0}ul.check li.done{color:var(--good)}
.ans,.contact,.cvrow,.opt,.fu,.applied,.cvpick{border-top:1px solid var(--line);padding:7px 0;display:grid;gap:6px}
.ans:first-child,.contact:first-child,.cvrow:first-child,.opt:first-child,.cvpick:first-child{border-top:0}
.ans .q,.contact .q,.cvrow .q{font-weight:600}
.sug{background:var(--panel-2);border-radius:var(--r-sm);padding:8px;font-size:13.5px}
.cvrow.off{opacity:.65}
/* ---- applications / profile ---- */
.approw{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;text-align:left;width:100%;cursor:pointer;color:var(--ink)}
.approw:hover{border-color:var(--line-2)}
.approw .t{font-weight:700;font-family:var(--display);font-size:14px}
.approw .s{color:var(--muted);font-size:12.5px}
.approw .next{font-size:12.5px;color:var(--ink-2);text-align:right;white-space:nowrap}
.prof{display:grid;gap:10px}
.chipset{display:flex;flex-wrap:wrap;gap:5px}
.chipset span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--ink-2);background:var(--panel-2)}
/* ---- responsive ---- */
@media (max-width:1100px){main{grid-template-columns:minmax(300px,42%) minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .side{flex-direction:row;align-items:center;order:2;padding:5px 8px calc(5px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid rgba(255,255,255,.08);gap:2px}
  .brand-head{display:none}

<script>
/* ===CORE-START=== pure logic, testable without a browser */
const Core = (() => {
  const clone = (o) => JSON.parse(JSON.stringify(o || {}));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const blankAction = (jobKey) => ({ job_key: jobKey, favorite: false, saved: false, applied_at: null, dismissed: false, note: null, rev: 0 });

  // Conditional write: the browser db API has no if_version, so take a short lease, read, check, write rev+1.
  async function commit(db, path, mutate, holder, opts = {}) {
    const ttlMs = opts.ttlMs || 2000, retries = opts.retries ?? 5;
    const ref = db.doc(path);
    for (let attempt = 0; ; attempt++) {
      let lease;
      try { lease = await ref.acquire({ holder, ttlMs }); }
      catch (e) {
        if (e && e.code === "invalid_argument" && opts.blank && !opts._created) {
          try { const s = await ref.get(); if (!s.exists) await ref.set(opts.blank); } catch (e2) { return { status: "error", code: e2 && e2.code || "unavailable" }; }
          opts = Object.assign({}, opts, { _created: true });
          continue;
        }
        return { status: "error", code: e && e.code || "unavailable", message: e && e.message };
      }
      if (!lease || !lease.acquired) {
        if (attempt >= retries) return { status: "busy", attempts: attempt + 1 };

        await sleep(isFinite(left) ? Math.max(150, Math.min(5000, left + 150)) : 600);
        continue;
      }
      let snap;
      try { snap = await ref.get(); } catch (e) { return { status: "error", code: e && e.code || "unavailable" }; }
      const cur = snap.exists ? (snap.data() || {}) : {};
      const out = mutate(clone(cur));
      if (!out || out.conflict) return { status: "conflict", current: cur, attempts: attempt + 1 };
      const next = out.doc;
      next.rev = (Number(cur.rev) || 0) + 1;
      next.updated_at = new Date().toISOString();
      next.updated_by = holder;
      try { await ref.set(next); } catch (e) { return { status: "error", code: e && e.code || "unavailable" }; }
      return { status: "saved", doc: next, attempts: attempt + 1 };
    }
  }
  function effective(job, action) {
    const s = (job && job.state) || {};
    // A synced note keeps the revision the page's own action document carries, so the next edit starts from it.
    const noteRev = (action && action.note && Number(action.note.rev)) || 0;
    const base = { favorite: !!s.favorited, saved: !!s.saved, applied_at: s.applied_at || null, dismissed: !!s.dismissed, note: s.note ? { text: s.note, rev: noteRev } : null, rev: 0 };
    if (!action || !(Number(action.rev) > Number(s.synced_rev || 0))) return Object.assign(base, { pending: false });
    return { favorite: !!action.favorite, saved: !!action.saved, applied_at: action.applied_at || null, dismissed: !!action.dismissed,
      note: action.note && action.note.text ? action.note : (action.note && action.note.deleted ? null : base.note), rev: Number(action.rev) || 0, pending: true };
  }
  const seenToAction = (seen) => seen ? { favorite: !!seen.favorite, saved: !!seen.saved, applied_at: seen.applied_at || null, dismissed: !!seen.dismissed, note: seen.note && seen.note.text ? { text: seen.note.text, rev: Number(seen.note.rev) || 0 } : null } : {};
  const setFlag = (jobKey, field, value, seen) => (cur) => {
    const d = Object.assign(blankAction(jobKey), seenToAction(seen), cur);
    if (field === "applied") d.applied_at = value ? new Date().toISOString() : null;
    else d[field] = !!value;
    return { doc: d };
  };
  const saveNote = (jobKey, baseNoteRev, text, seen) => (cur) => {
    const d = Object.assign(blankAction(jobKey), seenToAction(seen), cur);
    const stored = d.note && Number(d.note.rev) || 0;
    if (stored !== baseNoteRev) return { conflict: true };

    return { doc: d };
  };
  const setPrefs = (fields) => (cur) => ({ doc: Object.assign({ job_key: "_prefs" }, cur, fields) });

  function tabsFor(jobs, actions, run) {
    const eff = (k) => effective(jobs.get(k), actions.get(k));
    const all = [...jobs.keys()];
    const open = (k) => { const e = eff(k); return !e.dismissed && !e.applied_at; };
    const rec = ((run && run.recommended) || []).filter((k) => jobs.has(k)).filter(open);
    const byGroup = (g) => rec.filter((k) => (jobs.get(k) || {}).group === g);

      recommended: rec, good: byGroup("good"), worth_a_shot: byGroup("worth_a_shot"), backup: byGroup("backup"),
      uncertain: all.filter((k) => (jobs.get(k) || {}).list === "uncertain" && open(k)),
      old: all.filter((k) => (jobs.get(k) || {}).list === "old" && open(k)),

      applied: all.filter((k) => !!eff(k).applied_at), dismissed: all.filter((k) => eff(k).dismissed), all,

  // Up to n picks, best first; a different employer is preferred over a repeat only among equals (same group).
  function topPicks(keys, jobs, n = 5) {

    const out = first.concat(rest);

  const REQUEST_KINDS = ["prepare", "research", "contact", "message", "intro", "letter", "followup_draft", "handoff", "cv_file"];
  const randomId = (n) => { const a = new Uint8Array(n); (self.crypto || window.crypto).getRandomValues(a); return Array.from(a, (b) => b.toString(16).padStart(2, "0")).join(""); };

  const setFields = (jobKey, fields, seen) => (cur) => ({ doc: Object.assign(blankAction(jobKey), seenToAction(seen), cur, fields) });
  const setRequest = (jobKey, kind, id, params, seen) => (cur) => {
    const d = Object.assign(blankAction(jobKey), seenToAction(seen), cur);

    if (stored > baseRev) return { conflict: true };
    d.answers = Object.assign({}, d.answers || {}, { [aid]: { text: String(text || "").slice(0, 4000), rev: Math.max(stored, baseRev) + 1, updated_at: new Date().toISOString() } });
    return { doc: d };
  };
  const saveText = (jobKey, kind, text, baseRev, seen) => (cur) => {
    const d = Object.assign(blankAction(jobKey), seenToAction(seen), cur);
    const stored = Number(((d.texts || {})[kind] || {}).rev || 0);
    if (stored > baseRev) return { conflict: true };
    d.texts = Object.assign({}, d.texts || {}, { [kind]: { text: String(text || "").slice(0, 8000), rev: Math.max(stored, baseRev) + 1, updated_at: new Date().toISOString() } });

  };
  const setCv = (key, fields) => (cur) => { const d = Object.assign({ job_key: "_cvs", variants: {} }, cur); d.variants = Object.assign({}, d.variants || {}, { [key]: Object.assign({}, (d.variants || {})[key] || {}, fields) }); return { doc: d }; };
  const setCvRequest = (key, id) => (cur) => { const d = Object.assign({ job_key: "_cvs", variants: {} }, cur); d.requests = Object.assign({}, d.requests || {}, { cv_file: { id, at: new Date().toISOString(), params: { cv: key } } }); return { doc: d }; };
  // The state of one task as the page should show it: the page's own latest request wins until Hunter has
  // recorded that very id; then Hunter's state (running, ready, needs_input, failed) is the truth.
  function requestState(work, action, kind) {
    const mine = action && action.requests && action.requests[kind];
    const theirs = work && work.requests && work.requests[kind];
    if (mine && (!theirs || theirs.id !== mine.id)) return { state: "requested", id: mine.id, at: mine.at, mine: true };
    if (theirs) return { state: theirs.state, id: theirs.id, at: theirs.at, message: theirs.message, result: theirs.result || null, mine: false };
    return null;
  }
  // Words for a task's state: what Hunter is doing, then what the person can look at.
  const TASK_WORDS = {
    prepare: { idle: "Get application help", busy: "Preparing…", done: "Review application" },
    research: { idle: "Research company", busy: "Researching…", done: "View research" },
    letter: { idle: "Write cover letter", busy: "Drafting…", done: "Review cover letter" },
    intro: { idle: "Write short introduction", busy: "Drafting…", done: "Review introduction" },
    contact: { idle: "Find contacts", busy: "Finding contacts…", done: "View contacts" },
    message: { idle: "Draft a short message", busy: "Drafting…", done: "Review message" },
    followup_draft: { idle: "Draft follow-up", busy: "Drafting…", done: "Review follow-up" },
    handoff: { idle: "Prepare for interview", busy: "Writing hand-off…", done: "Hand-off ready" },
    cv_file: { idle: "Preview / download", busy: "Getting the file…", done: "File ready in Claude" },
  };
  function taskWords(kind) { return TASK_WORDS[kind] || { idle: kind, busy: "Working…", done: "Done" }; }
  // One main action per job, named by state. Never a generic "continue".
  function mainAction(work, action) {
    const applied = !!(action && Number(action.rev) > 0 ? action.applied_at : (work && work.state === "applied"));
    if (applied) return { kind: "view", label: "View application" };
    const prep = requestState(work, action, "prepare");
    const pkg = work && work.package;
    if (prep && (prep.state === "requested" || prep.state === "running")) return { kind: "progress", label: "Working…", busy: true };
    if (prep && prep.state === "needs_input") return { kind: "answer", label: "Answer question" };
    if (pkg && pkg.needs_review && pkg.needs_review.length) return { kind: "review", label: "Review changes" };
    if (pkg) return { kind: "review", label: "Review application" };
    if (prep && prep.state === "failed") return { kind: "prepare", label: "Get application help", failed: true };
    return { kind: "prepare", label: "Get application help" };
  }
  // The application's state in plain words.
  function appStatus(work, action) {
    const applied = !!(action && Number(action.rev) > 0 ? action.applied_at : (work && work.state === "applied"));
    if (applied) return { id: "applied", label: "Applied" };
    const prep = requestState(work, action, "prepare");
    const pkg = work && work.package;
    if (pkg && pkg.needs_review && pkg.needs_review.length) return { id: "needs_review", label: "The vacancy changed" };
    if (prep && prep.state === "needs_input") return { id: "needs_answer", label: "Needs your answer" };
    if (prep && (prep.state === "requested" || prep.state === "running")) return { id: "preparing", label: "Preparing" };
    if (prep && prep.state === "failed") return { id: "failed", label: "Couldn’t complete this" };

      if (rd.state === "ready_to_submit") return { id: "ready", label: "Ready to submit" };
      if ((rd.form_questions || 0) > (rd.answered || 0)) return { id: "needs_answer", label: "Needs your answer" };
      return { id: "ready", label: "Ready for review" };
    }
    return { id: "none", label: "Not applied" };
  }
  function pipelineStage(work, action) {
    const stage = work && work.application && work.application.stage;
    if (["rejected", "withdrawn"].includes(stage)) return "closed";
    if (["replied", "interview", "offer"].includes(stage)) return "interview";
    const s = appStatus(work, action);

    if (s.id === "ready") return "ready";

    const out = [];
    for (const raw of String(text || "").split(/\n+/)) {

      let limit = null; const m = /\(\s*(\d{2,5})\s*(?:chars?|characters|words?)?\s*\)\s*$/i.exec(line);

})();
