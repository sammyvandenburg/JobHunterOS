feeds:
  - {id: "remotive:devops", kind: remotive, config: {categories: [devops]}, note: "Remote jobs; attribution to Remotive required; 24h delay."}
  - {id: "arbeitnow:eu", kind: arbeitnow, config: {feed: eu, max_pages: 4}, note: "Europe (Germany first); newest pages only."}
  - {id: "arbeitnow:uk", kind: arbeitnow, config: {feed: uk, max_pages: 2}, note: "UK feed."}
  - {id: "adzuna:multi", kind: adzuna, config: {countries: [gb, us, ca, de, nl, fr, at], max_pages: 1}, note: "Optional; needs free Adzuna keys.", enabled: false}
