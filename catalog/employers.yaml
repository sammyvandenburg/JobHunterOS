# Starter employer catalogue for JobHunterOS.
#
# Every entry below was checked on `checked` by reading its public job board
# API once (read-only). "Reachable" means the board answered with a list of
# postings on that date. It says nothing about whether the employer is hiring
# for your kind of role right now; Hunter finds that out on each hunt.
#
# Fields: name, ats (greenhouse|lever|ashby), token (board token / site / board
# name), region (na|eu|both: where the employer mainly hires, not a promise),
# careers (public careers page), checked (YYYY-MM-DD).
version: 2026-10-21
